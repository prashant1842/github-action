name: Docker CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/docker.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/docker.yml'

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/github-actions-practice:latest \
            -t ghcr.io/${{ github.repository_owner }}/github-actions-practice:${{ github.sha }} .

      - name: Push latest image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/github-actions-practice:latest

      - name: Push versioned image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/github-actions-practice:${{ github.sha }}
