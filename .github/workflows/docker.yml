name: Docker CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t github-actions-practice .

      - name: Show Docker images
        run: docker images

      - name: Test Docker image
        run: docker run --rm github-actions-practice
