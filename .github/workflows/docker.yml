name: Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/github-actions-practice:latest \
            -t ghcr.io/${{ github.repository_owner }}/github-actions-practice:${{ github.sha }} .

      - name: Inspect Docker image
        run: |
          docker inspect \
            ghcr.io/${{ github.repository_owner }}/github-actions-practice:${{ github.sha }}

      - name: Check Docker image size
        run: |
          docker images \
            ghcr.io/${{ github.repository_owner }}/github-actions-practice:${{ github.sha }}

      - name: Test Docker image
        run: |
          docker run --rm \
            ghcr.io/${{ github.repository_owner }}/github-actions-practice:${{ github.sha }}

      - name: Show Docker containers
        run: docker ps -a

      - name: Push latest image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/github-actions-practice:latest

      - name: Push versioned image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/github-actions-practice:${{ github.sha }}

      - name: Workflow completed
        run: echo "Docker CI/CD workflow completed successfully!"
